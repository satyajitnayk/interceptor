[package]
name = "interceptor"
version = "0.1.0"
edition = "2024"
description = "Local HTTPS proxy to capture and inspect traffic with planned UI"
license = "MIT"

[dependencies]
warp = "0.3.7"
tokio = { version = "1.44.2", features = ["full"] }
serde = {version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
chrono = {version = "0.4.41", features = ["serde"] }
axum = "0.8.4"
uuid = {version = "1.16.0", features = ["v4"] }
clap = {version = "4.5.37", features = ["derive"] }
